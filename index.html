<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSTAKIMZX VRL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
header{background:#a60018;color:white;padding:19px 15px;text-align:center}
header h2{margin:0;font-size:23px}
header p{margin:6px 0 0;font-size:12px}
.mail{position:absolute;right:18px;top:22px;color:white;font-size:23px;text-decoration:none}
.container{max-width:650px;margin:22px auto;padding:15px}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.tabs button{flex:1;padding:15px 5px;border:0;border-radius:8px;background:#ddd;font-weight:bold;font-size:15px}
.tabs button.active{background:#a60018;color:white}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}
h3{margin-top:0;color:#a60018}
label{display:block;font-weight:bold;margin:14px 0 7px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:7px;font-size:16px}
.mainbtn{width:100%;padding:14px;margin-top:17px;border:0;border-radius:7px;background:#a60018;color:white;font-size:16px;font-weight:bold}
.secondary{background:#252525}
.result{margin-top:20px;text-align:center;overflow:auto}
.qrbox{display:inline-block;padding:12px;background:white;border:1px solid #ddd;margin:8px}
.qrbox p{font-weight:bold;font-size:13px}
#barcode{max-width:100%;height:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:110px}
.note{font-size:12px;color:#666;margin-top:12px}
footer{text-align:center;color:#777;font-size:12px;padding:22px}
.hidden{display:none}
</style>
</head>

<body>

<header>
<a class="mail" href="mailto:mustakimzx@gmail.com" onclick="this.href='mailto:mustakimsardar00142@gmail.com'">✉</a>
<h2>MUSTAKIMZX VRL</h2>
<p>Professional QR & Barcode Generator</p>
</header>

<div class="container">

<div class="tabs">
<button id="qrTab" class="active" onclick="showMode('qr')">QR CODE</button>
<button id="barTab" onclick="showMode('bar')">CODE 39 BARCODE</button>
</div>

<div id="qrSection" class="card">
<h3>QR CODE GENERATOR</h3>

<label>Starting Number / Value</label>
<input id="qrStart" type="text" placeholder="Example: 1090452546">

<label>Quantity</label>
<input id="qrQty" type="number" min="1" max="100" value="1">

<button class="mainbtn" onclick="makeQR()">GENERATE QR CODE</button>

<div id="qrResult" class="result"></div>

<div class="actions">
<button class="mainbtn secondary" onclick="downloadPDF()">DOWNLOAD A4 PDF</button>
<button class="mainbtn secondary" onclick="printQR()">PRINT</button>
</div>
<p class="note">QR codes are generated in sequence when the starting value is numeric.</p>
</div>

<div id="barSection" class="card hidden">
<h3>CODE 39 BARCODE GENERATOR</h3>

<label>Enter Your Number / Value</label>
<input id="barInput" type="text" placeholder="Example: 1090452546">

<button class="mainbtn" onclick="makeBarcode()">GENERATE BARCODE</button>

<div id="barResult" class="result">
<svg id="barcode"></svg>
</div>

<div class="actions">
<button class="mainbtn secondary" onclick="downloadBarcode()">DOWNLOAD PNG</button>
<button class="mainbtn secondary" onclick="printBarcode()">PRINT</button>
</div>
<p class="note">Code 39 mode generates only ONE barcode at a time.</p>
</div>

</div>

<footer>© 2026 MUSTAKIMZX VRL</footer>

<script>
let qrValues=[];

function showMode(mode){
document.getElementById('qrSection').classList.toggle('hidden',mode!=='qr');
document.getElementById('barSection').classList.toggle('hidden',mode!=='bar');
document.getElementById('qrTab').classList.toggle('active',mode==='qr');
document.getElementById('barTab').classList.toggle('active',mode==='bar');
}

function makeQR(){
let start=document.getElementById('qrStart').value.trim();
let qty=parseInt(document.getElementById('qrQty').value);
let box=document.getElementById('qrResult');
box.innerHTML='';
qrValues=[];

if(!start){alert('Please enter starting value');return}
if(!qty||qty<1||qty>100){alert('Quantity must be between 1 and 100');return}

if(!/^\d+$/.test(start)&&qty>1){
alert('Multiple QR codes require a numeric starting value.');
return;
}

for(let i=0;i<qty;i++){
let value=/^\d+$/.test(start)?String(Number(start)+i):start;
qrValues.push(value);

let item=document.createElement('div');
item.className='qrbox';
let qr=document.createElement('div');
let title=document.createElement('p');
title.textContent=value;
item.appendChild(qr);
item.appendChild(title);
box.appendChild(item);

new QRCode(qr,{
text:value,
width:160,
height:160,
correctLevel:QRCode.CorrectLevel.H
});
}
}

function getQRImages(){
let images=[];
document.querySelectorAll('#qrResult .qrbox').forEach(box=>{
let canvas=box.querySelector('canvas');
let img=box.querySelector('img');
if(canvas) images.push(canvas.toDataURL('image/png'));
else if(img) images.push(img.src);
});
return images;
}

async function downloadPDF(){
if(!qrValues.length){alert('Generate QR codes first');return}
const {jsPDF}=window.jspdf;
let pdf=new jsPDF('p','mm','a4');
let images=getQRImages();
let x=15,y=18;
images.forEach((src,i)=>{
if(i>0 && i%3===0){x=15;y+=85}
if(y>250){pdf.addPage();x=15;y=18}
pdf.setFontSize(11);
pdf.text(qrValues[i],x,y);
pdf.addImage(src,'PNG',x,y+4,55,55);
x+=62;
if(x>145){x=15;y+=85}
});
pdf.save('MUSTAKIMZX-QR-CODES.pdf');
}

function printQR(){
if(!qrValues.length){alert('Generate QR codes first');return}
let images=getQRImages();
let w=window.open('','_blank');
w.document.write('<html><head><title>QR Print</title><style>body{font-family:Arial;display:flex;flex-wrap:wrap}.item{width:30%;text-align:center;margin:10px}.item img{width:150px}</style></head><body>');
images.forEach((src,i)=>{
w.document.write('<div class="item"><img src="'+src+'"><p>'+qrValues[i]+'</p></div>');
});
w.document.write('</body></html>');
w.document.close();
w.onload=()=>w.print();
}

function makeBarcode(){
let value=document.getElementById('barInput').value.trim();
if(!value){alert('Please enter a value');return}
try{
JsBarcode('#barcode',value,{
format:'CODE39',
lineColor:'#000',
width:2,
height:100,
displayValue:true,
fontSize:18,
margin:10
});
}catch(e){alert('Invalid Code 39 value. Use A-Z, 0-9, space and supported symbols.')}
}

function barcodePNG(){
let svg=document.getElementById('barcode');
if(!svg.innerHTML){alert('Generate barcode first');return null}
let xml=new XMLSerializer().serializeToString(svg);
let blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
return URL.createObjectURL(blob);
}

function downloadBarcode(){
let url=barcodePNG();
if(!url)return;
let img=new Image();
img.onload=function(){
let canvas=document.createElement('canvas');
canvas.width=img.width*2;
canvas.height=img.height*2;
let ctx=canvas.getContext('2d');
ctx.fillStyle='white';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0,canvas.width,canvas.height);
let a=document.createElement('a');
a.href=canvas.toDataURL('image/png');
a.download='MUSTAKIMZX-CODE39.png';
a.click();
URL.revokeObjectURL(url);
};
img.src=url;
}

function printBarcode(){
let url=barcodePNG();
if(!url)return;
let w=window.open('','_blank');
w.document.write('<html><body style="text-align:center;padding:40px"><img src="'+url+'" onload="window.print()" style="max-width:100%"></body></html>');
w.document.close();
}
</script>

</body>
</html>
