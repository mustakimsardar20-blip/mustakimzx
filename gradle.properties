# ---- Phone / Termux build settings ----
# Kotlin daemon alag JVM banata hai; phone par RAM khatam ho jaati hai
# ("Could not connect to Kotlin compile daemon" / build chup-chaap fail).
# Is liye compiler ko usi Gradle JVM ke andar chalate hain.
kotlin.compiler.execution.strategy=in-process

# Termux ke liye 1.5 GB kaafi hai; metaspaces bhi chhota rakha hai.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Phone par daemon se hi problem hoti hai; har build ke baad JVM band.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
