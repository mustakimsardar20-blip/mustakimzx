name: Build APKs

# GitHub par APK banane ka tareeka (laptop ki zaroorat nahi):
#   1. github.com par account banayein -> New repository -> naam "MUSTAKIMZX"
#   2. "uploading an existing file" link se is folder ki saari files upload karein
#   3. Actions tab -> "Build APKs" -> Run workflow -> Run workflow
#   4. 5-10 min baad usi run ke neeche "Artifacts" se APK download karein

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # android-actions/setup-android sdkmanager, platform-34 aur build-tools
      # khud install karta hai. Iske bina "sdkmanager: command not found" aata hai.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # Repo me keystore.jks + keystore.properties hain to signed release APK
      # banti hai (wahi signature, is liye update seedha install hota hai).
      # Keystore na mile to debug APK banti hai - woh bhi install hoti hai.
      - name: Build APKs
        run: |
          if [ -f keystore.jks ] && [ -f keystore.properties ]; then
            echo "keystore mila -> signed release APK"
            gradle :scanner:assembleRelease :receiver:assembleRelease --no-daemon --stacktrace
          else
            echo "keystore nahi mila -> debug APK"
            gradle :scanner:assembleDebug :receiver:assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          # Wildcard se copy: filename ka bharosa nahi karna padta.
          find scanner/build/outputs/apk  -name '*.apk' -exec cp {} out/MUSTAKIMZX_scanner.apk \;
          find receiver/build/outputs/apk -name '*.apk' -exec cp {} out/MUSTAKIMZX_receiver.apk \;
          ls -lh out
          test -s out/MUSTAKIMZX_scanner.apk
          test -s out/MUSTAKIMZX_receiver.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MUSTAKIMZX-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
